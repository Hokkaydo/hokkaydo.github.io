base_url = "https://hokkaydo.github.io"
title = "AO - Blog"
description = "Personal blog"
theme = "apollo" 
taxonomies = [{ name = "tags" }]
compile_sass = true
build_search_index = true
generate_feeds = true
minify_html = true
generate_robots_txt = true
generate_sitemap = true
default_language = "fr"

[markdown]
external_links_target_blank = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
error_on_missing_language = true

[extra]
theme = "toggle-auto"
use_cdn = false
favicon = "/icon/favicon.png"
toc = true
fancy_code = true
dynamic_note = true
mathjax = true
repo_url = "https//github.com/Hokkaydo/blog/tree/main/content"
fediverse = false           # check what is
fediverse_creator = ""      # check what is

socials = [
    { name = "github", url = "https://github.com/Hokkaydo", icon = "github" },
]
menu = [
    { name = "/posts", url = "/posts", weight = 1},
    { name = "/projects", url = "/projects", weight = 2 },
    { name = "/about", url = "/about", weight = 3 },
    { name = "/tags", url = "/tags", weight = 4 },
]

stylesheets = [
    # "custom.css"      # at /static/custom.css
]

[extra.taxonomies]
sort_by = "page_count"
reverse = true

[extra.analytics]
enabled = false

[extra.analytics.google]
tracking_id = "G-XXXXXXX" # if tracking at some point

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"


